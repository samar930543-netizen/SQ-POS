<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#38bdf8" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- App Background -->
  <rect width="512" height="512" rx="104" fill="url(#bgGrad)" />
  <rect x="12" y="12" width="488" height="488" rx="92" fill="none" stroke="url(#accentGrad)" stroke-width="4" stroke-opacity="0.4" />
  
  <!-- POS Wholesale Symbol -->
  <g transform="translate(96, 80)" filter="url(#glow)">
    <!-- Main Box (Bundle) -->
    <rect x="30" y="70" width="260" height="200" rx="20" fill="#1e293b" stroke="#38bdf8" stroke-width="8" />
    
    <!-- Top Fold Lines -->
    <path d="M 30 130 L 290 130" stroke="#334155" stroke-width="6" stroke-dasharray="8 8" />
    <path d="M 160 70 L 160 270" stroke="#38bdf8" stroke-width="6" opacity="0.6" />
    
    <!-- SQ Monogram -->
    <text x="160" y="200" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="900" fill="#f8fafc" text-anchor="middle" letter-spacing="2">SQ</text>
    <text x="160" y="238" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="4">WHOLESALE</text>
    
    <!-- Cash / Bill floating badge -->
    <circle cx="270" cy="80" r="46" fill="url(#goldGrad)" stroke="#fef08a" stroke-width="6" />
    <text x="270" y="98" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="900" fill="#78350f" text-anchor="middle">₹</text>
  </g>
  
  <!-- Bottom Bar with POS dots -->
  <g transform="translate(156, 385)">
    <rect x="0" y="0" width="200" height="24" rx="12" fill="#1e293b" stroke="#475569" stroke-width="2" />
    <circle cx="40" cy="12" r="6" fill="#10b981" />
    <circle cx="80" cy="12" r="6" fill="#38bdf8" />
    <circle cx="120" cy="12" r="6" fill="#fbbf24" />
    <circle cx="160" cy="12" r="6" fill="#f43f5e" />
  </g>
</svg>
